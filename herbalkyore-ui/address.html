<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Address Form</title>
  <style>
    /* Your existing CSS styling here */
    body {
      font-family: Arial, sans-serif;
      background: #f2fdf1  ;
      padding: 20px;
    }
    .form-container {
      background-color:  #d6f4ad;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 20px;
      /* box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); */
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input, textarea {
      width: 480px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      width: 480px;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .footer-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between; /* Use space-around or center if needed */
      gap: 15rem;
      text-align: left;
    }
    .footer {
      background-color: #e6f6c8;
      padding: 1rem;
      font-family: Arial, sans-serif;
      color: #222;
      margin-top: 25px;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Address Form</h2>
  <form id="addressForm">
    <div class="form-group">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required>
    </div>

    <div class="form-group">
      <label for="address">Street Address</label>
      <textarea id="address" name="address" rows="2" required></textarea>
    </div>

    <div class="form-group">
      <label for="city">City</label>
      <input type="text" id="city" name="city" required>
    </div>

    <div class="form-group">
      <label for="state">State</label>
      <input type="text" id="state" name="state" required>
    </div>

    <div class="form-group">
      <label for="zip">PIN Code</label>
      <input type="text" id="zip" name="PIN" required>
    </div>

    <a href="index.html"><button type="submit">Submit Address</button></a>
  </form>
</div>
  <footer class="footer">
    <div class="footer-container">
      <!-- Your existing footer content here -->
      <p style="text-align:center;">&copy; 2025 HerbalKyore. All rights reserved.</p>
    </div>
  </footer>

  <script>
        document.getElementById("addressForm").addEventListener("submit", async function (e) {
          e.preventDefault();
        
          const cart = JSON.parse(localStorage.getItem("cart")) || [];
          if (cart.length === 0) {
            alert("Cart is empty. Please add items before submitting.");
            return;
          }
        
          const formData = {
            fullname: document.getElementById("fullname").value,
            phone: document.getElementById("phone").value,
            address: document.getElementById("address").value,
            city: document.getElementById("city").value,
            state: document.getElementById("state").value,
            PIN: document.getElementById("zip").value,
            cart: cart.map(item => `${item.name} (x${item.quantity}) - ₹${item.price}`).join(", ")
          };
        
          try {
            const response = await fetch("https://sheetdb.io/api/v1/5ll5ptjd4rhtm", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ data: formData })
            });
        
            if (response.ok) {
              alert("Order placed successfully!");
              localStorage.removeItem("cart");
              document.getElementById("addressForm").reset();
              updateCartCount();
              renderCart();
            } else {
              alert("Failed to submit. Please try again.");
            }
          } catch (error) {
            alert("Error connecting to server.");
            console.error(error);
          }
        });
    </script>

</body>
</html>
